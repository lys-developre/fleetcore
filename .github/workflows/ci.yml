name: CI

"on":
  push:
    # Every branch: work is pushed straight to branches, without pull requests
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · PHP 8.4 · Symfony 7.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fleetcore
          POSTGRES_USER: fleetcore
          POSTGRES_PASSWORD: fleetcore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetcore -d fleetcore"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET: ci-secret
      DATABASE_URL: postgresql://fleetcore:fleetcore@127.0.0.1:5432/fleetcore?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: in-memory://
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, opcache, zip, gd, apcu
          coverage: none
          tools: composer:v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-
      - name: Validate composer files
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Warm up the test kernel
        run: |
          php -v
          php bin/console about --no-interaction || true
          php bin/console cache:clear --no-interaction -vvv
          php bin/console assets:install public --no-interaction -vvv
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::php -m"; php -m; echo "::endgroup::"
          echo "::group::var/log"; cat var/log/*.log 2>/dev/null || echo "(no logs)"; echo "::endgroup::"
          echo "::group::env"; env | grep -E '^(APP_|DATABASE_URL|MESSENGER_)' ; echo "::endgroup::"
      - name: Lint container and YAML
        run: |
          php bin/console lint:container
          php bin/console lint:yaml config --parse-tags
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Database schema
        run: |
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      - name: Tests
        run: php bin/phpunit

  web:
    name: Web · Node 24 · Next.js 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api

  docker:
    name: Docker images · prod smoke · publish
    runs-on: ubuntu-latest
    needs: [api, web]
    permissions:
      contents: read
      packages: write
    env:
      # Images are published only from main, and only after the smoke passes against them
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      COMPOSE: docker compose -f compose.prod.yaml --env-file .env.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API (prod target)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: prod
          load: true
          tags: |
            ghcr.io/lys-developre/fleetcore-api:latest
            ghcr.io/lys-developre/fleetcore-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web (prod target)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: prod
          load: true
          tags: |
            ghcr.io/lys-developre/fleetcore-web:latest
            ghcr.io/lys-developre/fleetcore-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Same steps as infra/scripts/deploy.sh, with the images just built. DOMAIN=localhost makes Caddy
      # serve HTTPS from its internal CA, so the production Caddyfile and its headers are exercised too.
      - name: Start the production stack
        run: |
          cat > .env.prod <<EOF
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          IMAGE_TAG=${{ github.sha }}
          POSTGRES_DB=fleetcore
          POSTGRES_USER=fleetcore
          POSTGRES_PASSWORD=ci-password
          APP_SECRET=ci-secret-0123456789abcdef
          EOF
          $COMPOSE up -d --wait db
          $COMPOSE run --rm --no-deps api php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          $COMPOSE up -d --wait
          curl -fsSk --retry 30 --retry-delay 2 --retry-all-errors https://localhost/api/health && echo
          curl -fsSk --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null https://localhost/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Playwright smoke against the production images
        # Official image: browsers and their system libraries included, same version as @playwright/test
        run: |
          docker run --rm --network host --ipc host -e CI=true -e E2E_BASE_URL=https://localhost \
            -v "$PWD/apps/web:/app" -w /app \
            mcr.microsoft.com/playwright:v1.65.1-noble npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags ghcr.io/lys-developre/fleetcore-api
          docker push --all-tags ghcr.io/lys-developre/fleetcore-web
