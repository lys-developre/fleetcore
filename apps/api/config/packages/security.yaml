security:
    password_hashers:
        # Argon2id via "auto" (formularios-05, sección 6.3)
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # formularios-05, sección 4. ROLE_OPERARIO stands alone.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_OFICINA]
        ROLE_OFICINA: [ROLE_CONSULTA]

    providers:
        app_users:
            entity:
                class: App\Identity\Domain\User
                property: id

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: app_users
            user_checker: App\Identity\Infrastructure\Security\UserChecker
            # Opaque device tokens (ADR 002): Authorization: Bearer <token>
            access_token:
                token_handler: App\Identity\Infrastructure\Security\AccessTokenHandler
                failure_handler: App\Identity\Infrastructure\Security\JsonAuthenticationResponder
            entry_point: App\Identity\Infrastructure\Security\JsonAuthenticationResponder
            access_denied_handler: App\Identity\Infrastructure\Security\AuditedAccessDeniedHandler

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(login|activation|password-reset), roles: PUBLIC_ACCESS }
        # Everything else needs a signed-in user; what they may do is each voter's decision.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
