security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Replaced in H1 by the entity provider over App\Identity\Domain\User (identifier: mobile phone).
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: users_in_memory
            # H1 adds: access_token with App\Identity\Infrastructure\Security\AccessTokenHandler

    access_control:
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        # Everything else under /api requires an authenticated user once H1 lands.

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
